name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Code
        run: npx expo prebuild --platform android --clean

      - name: Batasi arsitektur ke arm64-v8a (kecilkan ukuran APK)
        run: echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties

      - name: Hemat memori Gradle (cegah OOM saat kompilasi native)
        run: |
          echo "org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties

      - name: Build APK Release
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinanceKu-App
          path: android/app/build/outputs/apk/release/*.apk
